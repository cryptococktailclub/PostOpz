<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PostOpz Premiere Presence</title>
  <style>
    :root { color-scheme: dark; --bg:#11131a; --panel:#181c27; --line:#343b4d; --text:#f6f8fc; --muted:#aeb7c9; --cyan:#37d9ff; --green:#60d6a2; --red:#ff8d9a; }
    * { box-sizing:border-box; } body { margin:0; min-width:260px; background:var(--bg); color:var(--text); font:13px/1.45 system-ui,sans-serif; }
    main { padding:18px; } h1 { margin:0; font-size:17px; } p { color:var(--muted); } .eyebrow { color:var(--cyan); font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .pairing-fields { display:grid; gap:11px; margin-top:16px; } .field { display:grid; gap:5px; color:var(--muted); font-size:11px; font-weight:700; }
    input { width:100%; border:1px solid var(--line); border-radius:6px; padding:9px; background:#0c0e14; color:var(--text); font:inherit; }
    button { border:0; border-radius:6px; padding:10px; background:linear-gradient(135deg,#4778ff,#8454ff); color:#fff; font-weight:800; cursor:pointer; }
    button.secondary { background:transparent; border:1px solid var(--line); } .status { margin-top:14px; padding:11px; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--muted); }
    .status.ok { border-color:rgba(96,214,162,.45); color:var(--green); } .status.error { border-color:rgba(255,141,154,.45); color:var(--red); } .context { margin-top:13px; padding:11px; border-radius:7px; background:rgba(55,217,255,.07); color:var(--muted); font-size:12px; }
    .hidden { display:none; } code { color:var(--cyan); overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PostOpz Console</p>
    <h1>Premiere Presence</h1>
    <p>Pairs this workstation to one Console production and sends a small activity heartbeat every minute while this panel is open.</p>
    <div class="pairing-fields">
      <div class="field">Console presence endpoint<input id="endpoint" type="text" placeholder="https://…/console/premiere/presence"></div>
      <div class="field">Paired workstation ID<input id="agent-id" type="text" placeholder="From the production workspace"></div>
      <div class="field">Pairing token<input id="pairing-token" type="text" placeholder="Shown once by Console"></div>
      <div class="field">Your display name<input id="editor-name" type="text" maxlength="120" placeholder="e.g. Michael Newton"></div>
      <button id="save-pairing" type="button">Save pairing and send now</button>
      <button class="secondary" id="send-now" type="button">Send presence update</button>
    </div>
    <div class="context" id="context">Waiting for an open Premiere project.</div>
    <div class="status" id="status">Not paired.</div>
  </main>
  <script src="index.js"></script>
</body>
</html>
